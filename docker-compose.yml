services:
  postgres:
    image: postgres:16
    container_name: context-bridge-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: contextbridge
      POSTGRES_PASSWORD: contextbridge
      POSTGRES_DB: context_bridge
    ports:
      - "5432:5432"
    volumes:
      - context-bridge-data:/var/lib/postgresql/data

volumes:
  context-bridge-data:
