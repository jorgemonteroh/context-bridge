<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <title>Context Bridge</title>
        <style>
            body { font-family: sans-serif; max-width: 700px; margin: 40px auto; padding: 0 20px; }
            select, button { font-size: 1rem; padding: 8px; margin-right: 8px; }
            textarea { width: 100%; height: 300px; margin-top: 16px; font-size: .9rem; font-family: monospace; padding: 10px; }
            input { width: 100%; padding: 8px; font-size: 1rem; font-family: monospace; }
            #status { color: green; margin-left: 10px; }
        </style>
    </head>
    <body>
        <h1>Context Bridge</h1>

        <select id="projectSelect"></select>
        <button id="compileBtn">Compilar contexto</button>

        <textarea id="contextOutput" readonly placeholder="Aquí aparecerá el contexto compilado..."></textarea>
        <br/>
        <button id="copyBtn">Copiar al portapapeles</button>
        <span id="status"></span>

        <hr />

        <h2>Context Entries</h2>
        <ul id="entriesList"></ul>
        
        <h3>Nueva entry</h3>
        <form id="entryForm">
            <select id="entryType">
            <option value="DECISION">Decisión</option>
            <option value="CONVENTION">Convención</option>
            <option value="SNIPPET">Snippet</option>
            <option value="TASK_STATUS">Estado de tarea</option>
            </select>
            <br /><br />
            <input id="entryTitle" placeholder="Título" required />
            <br /><br />
            <textarea id="entryContent" placeholder="Contenido" required style="height: 100px;"></textarea>
            <br /><br />
            <button type="submit">Añadir entry</button>
        </form>

        <br /><hr />

        <h3>Nuevo proyecto</h3>
        <form id="projectForm">
            <input id="projectName" placeholder="Nombre del proyecto" required />
            <br /><br />
            <textarea id="projectDescription" placeholder="Descripción del proyecto" required></textarea>
            <br /><br />
            <button type="submit">Añadir proyecto</button>
        </form>

        <script src="app.js"></script>
    </body>
</html>
